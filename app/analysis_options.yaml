include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
    - build/**
    - android/**
    - web/**

linter:
  rules:
    # Projeto de aplicativo (nao biblioteca): exigir doc em todo membro
    # publico seria ruido.
    public_member_api_docs: false
